<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="MAINTSUPP">
<!-- The MAINTSUPP M. Traced from the 1024px brand tile: strokes 120 wide with
     round caps and joins, left white at x=176, right teal at x=848, meeting at
     the valley (512,607); corner radius 170. The corners are TRANSPARENT, not
     white - the source is a JPEG whose corners are #f7f7f7, and shipping that
     puts a white frame in every browser tab. -->
<rect width="1024" height="1024" rx="170" ry="170" fill="#101920"/>
<g fill="none" stroke-width="120" stroke-linecap="round" stroke-linejoin="round">
<path d="M176 823V248l336 359" stroke="#ffffff"/>
<path d="M512 607l336-359v575" stroke="#12b4a8"/>
</g>
</svg>
